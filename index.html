button>
  </div>
</section>

<!-- ===== Featured cars ===== -->
<section class="featured-cars">
  <h2 class="section-title" data-i18n="featured_title">سيارات مميزة</h2>
  <p class="section-sub" id="resultsCount"></p>

  <div class="car-grid" id="carGrid"></div>
</section>

<!-- ===== Sell your car ===== -->
<section class="sell-panel" id="sell">
  <div class="sell-box">
    <h2 data-i18n="sell_title">عندك سيارة تبيعها؟</h2>
    <p data-i18n="sell_sub">أضف إعلانك في دقيقتين وسيراه آلاف المشترين في سوقك المستهدف.</p>
    <button class="btn btn-primary" id="sellCtaBtn" data-i18n="sell_cta">عرض سيارتي للبيع</button>
  </div>
</section>

<footer class="site-footer">
  <p data-i18n="footer_note">يمكنك تصفح CarHub بحرية كزائر — الحساب مطلوب فقط عند نشر إعلان أو التواصل مع بائع.</p>
</footer>

<!-- ===== Auth modal ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">&times;</button>
    <h2 data-i18n="modal_title">مرحبًا بك في CarHub</h2>
    <p class="modal-sub" data-i18n="modal_sub">سجّل دخولك للوصول إلى إعلاناتك ومحادثاتك، أو تابع كزائر.</p>

    <div class="modal-tabs">
      <button class="tab-btn active" data-tab="login" data-i18n="tab_login">تسجيل الدخول</button>
      <button class="tab-btn" data-tab="register" data-i18n="tab_register">إنشاء حساب</button>
    </div>

    <form class="modal-form" id="loginForm">
      <input type="email" data-i18n-placeholder="ph_email" placeholder="البريد الإلكتروني" required>
      <input type="password" data-i18n-placeholder="ph_password" placeholder="كلمة المرور" required>
      <button type="submit" class="btn btn-primary full" data-i18n="tab_login">تسجيل الدخول</button>
    </form>

    <form class="modal-form hidden" id="registerForm">
      <input type="text" data-i18n-placeholder="ph_name" placeholder="الاسم الكامل" required>
      <input type="email" data-i18n-placeholder="ph_email" placeholder="البريد الإلكتروني" required>
      <input type="password" data-i18n-placeholder="ph_password" placeholder="كلمة المرور" required>
      <button type="submit" class="btn btn-primary full" data-i18n="tab_register">إنشاء حساب</button>
    </form>

    <button class="guest-link" id="modalGuestBtn" data-i18n="guest_btn">المتابعة كزائر</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
