<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Cars</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    text-align:center;
}

header{
    background:#000;
    padding:20px;
}

h1{
    color:gold;
}

.car{
    background:#222;
    margin:20px;
    padding:20px;
    border-radius:10px;
}

img{
    width:100%;
    max-width:500px;
    border-radius:10px;
}

.price{
    color:gold;
    font-size:22px;
    font-weight:bold;
}

button{
    background:gold;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}
</style>
</head>

<body>

<header>
    <h1>🚗 Luxury Cars</h1>
    <p>أفضل السيارات الفاخرة</p>
</header>

<div class="car">
    <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70" alt="Mercedes">
    <h2>Mercedes AMG</h2>
    <p class="price">$120,000</p>
    <button>شراء الآن</button>
</div>

<div class="car">
    <img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7" alt="BMW">
    <h2>BMW M8</h2>
    <p class="price">$110,000</p>
    <button>شراء الآن</button>
</div>

<div class="car">
    <img src="https://images.unsplash.com/photo-1502877338535-766e1452684a" alt="Audi">
    <h2>Audi R8</h2>
    <p class="price">$150,000</p>
    <button>شراء الآن</button>
</div>

</body>
</html>
